name: RMI official tender monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '15 17 * * *' # Daily 17:15 UTC, before ChatGPT's evening review
  push:
    branches: [main]
    paths:
      - 'monitor.py'
      - 'check_rmi.py'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/rmi-probe.yml'

permissions:
  contents: write # Only this isolated repository, to store official snapshots

concurrency:
  group: rmi-monitor-state
  cancel-in-progress: false

jobs:
  monitor:
    name: Verify RMI and compare snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out isolated repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install requests==2.32.5

      - name: Regression tests (no network)
        run: python -m unittest discover -s tests -v

      - name: Fetch official RMI data and compare
        run: python monitor.py

      - name: Commit verified snapshot to this repository only
        if: success()
        run: |
          git config user.name "rmi-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update verified official RMI tender snapshot [skip ci]"
            git push origin HEAD:main
          fi

      - name: Check access to official PDF document endpoint
        if: always()
        run: python scripts/document_api_probe.py

      - name: Save report even when access fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rmi-monitor-report
          path: reports/*.json
          if-no-files-found: warn
          retention-days: 30
