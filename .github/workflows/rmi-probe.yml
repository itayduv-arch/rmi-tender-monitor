name: RMI official API connectivity pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'check_rmi.py'
      - '.github/workflows/rmi-probe.yml'
  schedule:
    - cron: '15 18 * * *'  # Daily, 18:15 UTC

permissions:
  contents: read

jobs:
  probe:
    name: Read-only official RMI API probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out isolated repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install HTTP dependency
        run: python -m pip install requests==2.32.5

      - name: Probe RMI for Hod Hasharon 470/2025
        env:
          TENDER_NUMBER: '470/2025'
        run: python check_rmi.py

      - name: Upload official response/error report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rmi-pilot-report
          path: reports/last-check.json
          if-no-files-found: warn
          retention-days: 30
