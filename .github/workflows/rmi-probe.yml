name: RMI official tender monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '15 16 * * *' # Daily 16:15 UTC, ahead of 16:58 UTC ChatGPT review
  push:
    branches: [main]
    paths:
      - 'monitor.py'
      - 'check_rmi.py'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/rmi-probe.yml'

permissions:
  contents: write # Only this isolated repository, to store official snapshots

concurrency:
  group: rmi-monitor-state
  cancel-in-progress: false

jobs:
  monitor:
    name: Verify RMI and compare snapshots
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out isolated repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install requests==2.32.5 'pypdf>=5,<7' playwright==1.58.0

      - name: Regression tests (no network)
        run: python -m unittest discover -s tests -v

      - name: Fetch official RMI data and compare
        run: python monitor.py

      - name: Official locality diagnostic
        if: success()
        run: python -m scripts.location_probe

      - name: Install read-only browser
        if: success()
        run: python -m playwright install chromium --with-deps

      - name: Inspect official form entry points
        if: success()
        continue-on-error: true
        run: python -m scripts.form_probe

      - name: Persist browser check results
        if: success()
        run: python -m scripts.merge_browser

      - name: Commit verified snapshot to this repository only
        if: success()
        run: |
          git config user.name "rmi-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update verified official RMI tender snapshot [skip ci]"
            # Other edits may land while RMI is responding; reconcile before pushing.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Save report even when access fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rmi-monitor-report
          path: reports/
          if-no-files-found: warn
          retention-days: 30
