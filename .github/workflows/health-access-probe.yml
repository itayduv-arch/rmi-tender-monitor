name: Ministry of Health public source access check

on:
  workflow_dispatch:
  schedule:
    - cron: '40 3 * * *' # Daily access check, independent of RMI
  push:
    branches: [main]
    paths:
      - 'health/probe.py'
      - 'health/verify_sources.py'
      - 'health/extra_checks.py'
      - 'health/procurement_archive.py'
      - 'health/moh_feed_mirror.py'
      - 'health/official_feeds.py'
      - 'health/registry_detail_probe.py'
      - '.github/workflows/health-access-probe.yml'

permissions:
  contents: write

concurrency:
  group: health-source-access
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout independent monitoring source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only client and browser
        run: |
          python -m pip install requests==2.32.5 pypdf==6.1.3 playwright==1.58.0 openpyxl==3.1.5 xlrd==2.0.2
          python -m playwright install chromium --with-deps
      - name: Check official MOH sources with HTTP and Chromium
        run: python health/probe.py
      - name: Cross-check live facility licences with 2025 ministry report
        run: python health/verify_sources.py
      - name: Verify alternate official sources and procurement search results
        run: python health/extra_checks.py
      - name: Retrieve independent official procurement archive
        run: python health/procurement_archive.py
      - name: Inspect registry facility detail views for certificate-level evidence
        run: python health/registry_detail_probe.py
      - name: Test official MOH publication RSS and open-data discovery
        run: python health/official_feeds.py
      - name: Discover blocked Ministry of Health RSS items via public secondary index
        run: python health/moh_feed_mirror.py
      - name: Save public source status without altering RMI data
        if: always()
        run: |
          if [ -f health/state/latest.json ]; then
            git config user.name "health-source-monitor-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add health/state/latest.json health/state/facilities.json health/state/source_checks.json health/state/official_feeds.json health/state/registry_details.json health/state/procurement_archive.json health/state/moh_feed_mirror.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: record Ministry of Health public access check [skip ci]"
              git pull --rebase -X ours origin main
              git push origin HEAD:main
            fi
          fi
      - name: Store health access report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ministry-of-health-access
          path: health/state/
          if-no-files-found: warn
          retention-days: 14
